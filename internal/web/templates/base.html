<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — tulli</title>
<style>
  :root { --fg:#1a1a1a; --muted:#666; --line:#ddd; --bg:#fafafa; --accent:#0b5; --bad:#c33; }
  * { box-sizing: border-box; }
  body { font: 15px/1.5 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
         color: var(--fg); margin: 0; background: var(--bg); }
  header { display: flex; align-items: center; gap: 1.2rem; padding: .7rem 1.2rem;
           background: #fff; border-bottom: 1px solid var(--line); }
  header .brand { font-weight: 700; letter-spacing: .5px; }
  header nav { display: flex; gap: 1rem; }
  header .spacer { flex: 1; }
  a { color: #06c; text-decoration: none; }
  a:hover { text-decoration: underline; }
  main { max-width: 960px; margin: 1.5rem auto; padding: 0 1.2rem; }
  h1 { font-size: 1.4rem; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .8rem; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; }
  .badge { display: inline-block; padding: .1rem .5rem; border-radius: 999px; font-size: .75rem; font-weight: 600; }
  .badge.clean { background: #e7f7ee; color: #0a6; }
  .badge.bad { background: #fde8e8; color: var(--bad); }
  .badge.role { background: #eef; color: #338; }
  form.inline { display: inline; }
  fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 1rem 0; padding: 1rem; background: #fff; }
  legend { font-weight: 600; padding: 0 .4rem; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: .5rem 0 .15rem; }
  input[type=text], input[type=password], textarea, select {
    font: inherit; padding: .4rem .5rem; border: 1px solid var(--line); border-radius: 4px; width: 100%; }
  textarea { min-height: 4rem; }
  button { font: inherit; font-weight: 600; padding: .4rem .9rem; border: 1px solid var(--line);
           border-radius: 4px; background: #fff; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { color: var(--bad); border-color: var(--bad); }
  .banner { padding: .6rem .8rem; border-radius: 6px; margin: 1rem 0; }
  .banner.err { background: #fde8e8; color: var(--bad); }
  .banner.ok { background: #e7f7ee; color: #0a6; }
  .muted { color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
</style>
</head>
<body>
<header>
  <span class="brand">tulli</span>
  {{if .Me.Login}}
  <nav>
    <a href="/">Repos</a>
    <a href="/account">Account</a>
    {{if canAdmin .Me.Role}}<a href="/users">Users</a>{{end}}
  </nav>
  <span class="spacer"></span>
  <span class="muted">{{.Me.Login}} <span class="badge role">{{.Me.Role}}</span></span>
  <form class="inline" method="post" action="/logout"><button>Sign out</button></form>
  {{end}}
</header>
<main>
{{template "content" .}}
</main>
</body>
</html>
