{{define "content"}}
<h1>Sign in</h1>
{{if .Data.Error}}<div class="banner err">{{.Data.Error}}</div>{{end}}
<form method="post" action="/login">
  <label for="token">Access token</label>
  <input type="password" id="token" name="token" autofocus autocomplete="off">
  <p class="muted">Paste the token issued to your account. (LDAP / OIDC sign-in will appear here later.)</p>
  <button class="primary" type="submit">Sign in</button>
</form>
{{end}}
