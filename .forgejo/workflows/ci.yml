# Forgejo Actions CI — lint, vet, build, and the full test suite (race + real
# Postgres via embedded-postgres + gitleaks). Runs on every push to main and on
# every pull request.
#
# NOTE: `runs-on: ubuntu-latest` must match a label your Forgejo runner
# advertises; change it if your runner registered with different labels. The
# image job builds with buildah (daemonless — no Docker socket needed).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Keep in sync with the Dockerfile's GITLEAKS_VERSION.
  GITLEAKS_VERSION: "8.21.2"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # Deps are vendored, so build/test are offline for modules; Go auto-selects
      # -mod=vendor when vendor/ is present.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # Install the same gitleaks the Dockerfile pins so the secret-scan
      # integration tests run instead of skipping.
      - name: install gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # embedded-postgres downloads a real PG into $HOME on first run, so the
      # store/pg and realstack tests exercise Postgres for real.
      - name: test (race, real Postgres + gitleaks)
        run: go test -race ./...

  # Validate the Dockerfile actually builds — we cannot in the dev sandbox, so CI
  # is where the trixie base + gitleaks/trivy download + image layout are proven
  # (advances #9). PR-only: main and tags build+push in release.yml, so the image
  # is never built twice for the same event. Built with buildah (daemonless);
  # vfs storage needs no overlay/fuse, so it works in an unprivileged job.
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install buildah
        run: sudo apt-get update && sudo apt-get install -y buildah
      - name: build image (validate, no push)
        run: buildah bud --storage-driver vfs -t tulli:ci .
